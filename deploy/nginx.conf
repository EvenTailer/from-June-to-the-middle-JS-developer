# Nginx: пример серверного блока для SPA с клиентским роутингом.
# Замените /var/www/js-tutorial на путь к папке dist.

server {
    listen 80;
    server_name example.com;

    root /var/www/js-tutorial;
    index index.html;

    # хэшированные ассеты можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # любой неизвестный путь отдаёт index.html, дальше маршрутизация в браузере
    location / {
        try_files $uri $uri/ /index.html;
    }
}
