name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Text, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the content
        run: npm run validate:content

      - name: Check the solutions of the tasks
        run: npm run check:solutions

      - name: Check the types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
