<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive Q&A tutorial from JavaScript basics to middle-level frontend mastery."
    />
    <title>JS → Middle · Interactive Tutorial</title>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var raw = localStorage.getItem('js-tutorial:state:v1');
          var parsed = raw ? JSON.parse(raw) : null;
          if (parsed && parsed.ui && (parsed.ui.theme === 'light' || parsed.ui.theme === 'dark')) {
            theme = parsed.ui.theme;
          } else {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
        } catch (error) {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
